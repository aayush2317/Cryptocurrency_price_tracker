<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before React loads to prevent a theme flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('cryptopulse-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e10" />
    <meta
      name="description"
      content="CryptoPulse — your clear view of the crypto market. Explore prices, market movers, interactive charts, and your personal watchlist."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CryptoPulse · Market Overview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
